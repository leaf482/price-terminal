services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${PGDATABASE:-price_terminal}
      POSTGRES_USER: ${PGUSER:-price_terminal}
      POSTGRES_PASSWORD: ${PGPASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  postgres_data:
